name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  typecheck:
    name: TypeScript
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: 'pnpm'
      - run: pnpm install --frozen-lockfile=false
      # Build engine first — server and connector-discord depend on engine/dist for type resolution.
      # Engine has composite:true so tsc --build validates it; --noEmit is incompatible with composite.
      - run: pnpm --filter @deck-monsters/engine run build
      - run: pnpm --filter @deck-monsters/server exec tsc --noEmit
      - run: pnpm --filter @deck-monsters/connector-discord exec tsc --noEmit
      # Web uses vite's bundler resolution; tsc --noEmit validates it separately
      - run: pnpm --filter @deck-monsters/web exec tsc --noEmit

  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: 'pnpm'
      - run: pnpm install --frozen-lockfile=false
      # Lint the new TypeScript packages. The engine package has ~2150 pre-existing
      # any-type warnings from the legacy JS→TS migration and is linted separately
      # as part of that cleanup effort.
      - run: pnpm --filter @deck-monsters/server run lint
      - run: pnpm --filter @deck-monsters/connector-discord run lint
      - run: pnpm --filter @deck-monsters/web run lint

  test:
    name: Tests
    runs-on: ubuntu-latest
    # Real Postgres for the *.pg.test.ts suites (save ordering, the room-state backfill, the
    # migration runner). Without it they skipped and "passed" (roadmap 10, item H).
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: deck_monsters_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      TEST_DATABASE_URL: postgres://postgres:postgres@localhost:5432/deck_monsters_test
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: 'pnpm'
      - run: pnpm install --frozen-lockfile=false
      # Build engine first — server and connector-discord tests import from engine/dist
      - run: pnpm --filter @deck-monsters/engine run build
      - run: pnpm docs:check
      # The checker's own tests are plain node:test and sit outside the turbo pipeline.
      - run: pnpm test:docs
      # Harness tests spawn `dist/scripts/repro-sim-seed.js` (compiled output).
      - run: pnpm --filter @deck-monsters/harness run build
      # Give the test database the production schema: Supabase stubs, then every migration
      # through the same runner Railway uses before a deploy.
      - run: psql "$TEST_DATABASE_URL" -v ON_ERROR_STOP=1 -f packages/server/scripts/ci-supabase-stubs.sql
      - run: pnpm --filter @deck-monsters/server run build
      - run: node packages/server/dist/migrate-cli.js
        env:
          DATABASE_URL: ${{ env.TEST_DATABASE_URL }}
      - run: pnpm run test
      - run: pnpm --filter @deck-monsters/web run test
