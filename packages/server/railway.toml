[build]
builder = "DOCKERFILE"
dockerfilePath = "packages/server/Dockerfile"
watchPatterns = ["packages/server/**", "packages/engine/**", "supabase/migrations/**"]

[deploy]
# Applies pending supabase/migrations before the new release takes traffic; a failure fails the
# deploy and the old release keeps serving.
preDeployCommand = ["node packages/server/dist/migrate.js"]
healthcheckPath = "/health"
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 3
