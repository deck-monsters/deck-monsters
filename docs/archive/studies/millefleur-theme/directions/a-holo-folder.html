<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Direction A Holo Folder</title>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&amp;family=JetBrains+Mono:wght@400;600&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
.tab{flex:none;padding:8px 13px;font:600 13px/1 Fredoka,sans-serif;color:#6f4c8e;background:#fff;border-radius:999px;box-shadow:0 0 0 2px #fff, 0 2px 6px rgba(176,22,110,.15)}
.tab.on{color:#230f3d;background:linear-gradient(115deg,#ffd1ec,#fff3c4,#c9f7e4,#cfe6ff,#e3d4ff)}
.slot{height:92px;border-radius:16px;background:#fff;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;box-shadow:0 0 0 2px #fff, 0 2px 0 #e3c4ee, 0 6px 14px rgba(176,22,110,.12)}
.slot.empty{background:#fff6fb;box-shadow:inset 0 0 0 2px #f2d4fc}
.nm{font:600 12px/1.15 'JetBrains Mono',monospace;color:#3d1f5e;text-align:center;padding:0 6px}
.rl{font:700 9px/1 Fredoka,sans-serif;letter-spacing:.08em;padding:3px 8px;border-radius:999px;color:#fff}
</style>
</head>
<body style="margin:0">
<div style="position:relative;width:390px;height:760px;overflow:hidden;font-family:Fredoka,sans-serif;color:#3d1f5e;background-color:#fff6fb;background-image:radial-gradient(circle at 15% 10%, rgba(255,143,208,.35), transparent 40%), radial-gradient(circle at 95% 40%, rgba(128,212,255,.35), transparent 45%), radial-gradient(circle at 30% 95%, rgba(143,240,184,.35), transparent 45%)">
  <div aria-hidden="true" style="position:absolute;left:0;top:0;bottom:0;width:8px;background:linear-gradient(to bottom,#ff8fd0,#ffb38a,#ffe680,#8ff0b8,#80d4ff,#b59cff)"></div>

  <header style="display:flex;align-items:center;gap:8px;padding:16px 16px 10px 24px">
    <span style="font:700 16px/1 Fredoka,sans-serif;color:#b0166e">Deck Monsters</span>
    <span style="color:#e3c4ee">/</span>
    <span style="font:500 16px/1 Fredoka,sans-serif;color:#3d1f5e;flex:1">Crazy chickens</span>
    <button aria-label="Open menu" style="width:38px;height:38px;border:0;border-radius:999px;background:#fff;box-shadow:0 0 0 2px #fff, 0 2px 6px rgba(176,22,110,.2);display:flex;align-items:center;justify-content:center;padding:0"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#b0166e" stroke-width="2.4" stroke-linecap="round"><path d="M5 7h14M5 12h14M5 17h14"></path></svg></button>
  </header>

  <nav aria-label="Places" style="display:flex;gap:8px;padding:6px 0 14px 24px;overflow:hidden">
    <span class="tab">The Ring</span><span class="tab">Console</span><span class="tab">Chat</span><span class="tab on">Workshop</span><span class="tab">Fights</span>
  </nav>

  <section style="margin:0 16px 0 24px;padding:18px 16px;background:#fff;border-radius:18px;box-shadow:0 0 0 3px #fff, 0 2px 0 #e3c4ee, 0 10px 24px rgba(176,22,110,.14);display:flex;flex-direction:column;gap:12px">
    <div style="display:flex;align-items:center;gap:12px">
      <div style="width:64px;height:64px;border-radius:50%;background:linear-gradient(135deg,#ffd1ec,#cfe6ff);display:flex;align-items:center;justify-content:center;box-shadow:0 0 0 3px #fff, 0 2px 8px rgba(176,22,110,.25)">
        <svg width="44" height="33" viewBox="0 0 12 9" shape-rendering="crispEdges" style="filter:drop-shadow(1px 0 0 #fff) drop-shadow(-1px 0 0 #fff) drop-shadow(0 1px 0 #fff) drop-shadow(0 -1px 0 #fff)"><rect x="8" y="0" width="1" height="1" fill="#e8c76a"></rect><rect x="7" y="1" width="2" height="1" fill="#fde9a8"></rect><rect x="6" y="2" width="4" height="1" fill="#f7f5ff"></rect><rect x="5" y="3" width="6" height="1" fill="#f7f5ff"></rect><rect x="8" y="3" width="1" height="1" fill="#2a2f6b"></rect><rect x="0" y="4" width="10" height="2" fill="#f7f5ff"></rect><rect x="0" y="6" width="9" height="1" fill="#e6e1f7"></rect><rect x="1" y="7" width="2" height="2" fill="#8f84bd"></rect><rect x="4" y="7" width="1" height="2" fill="#8f84bd"></rect><rect x="7" y="7" width="2" height="2" fill="#8f84bd"></rect></svg>
      </div>
      <div>
        <h2 style="margin:0;font:700 24px/1 Fredoka,sans-serif;color:#230f3d">Poirot</h2>
        <div style="font-size:14px;color:#6f4c8e;margin-top:4px">Unicorn · Lvl 2</div>
      </div>
    </div>
    <div style="display:flex;align-items:center;gap:8px;font-size:13px;color:#6f4c8e"><span style="width:62px">HP 33/33</span><span style="flex:1;height:10px;border-radius:999px;background:#f2d4fc"><span style="display:block;height:100%;width:100%;border-radius:999px;background:#2a8f80"></span></span></div>
    <div style="display:flex;align-items:center;gap:8px;font-size:13px;color:#6f4c8e"><span style="width:62px">XP 13/28</span><span style="flex:1;height:10px;border-radius:999px;background:#f2d4fc"><span style="display:block;height:100%;width:46%;border-radius:999px;background:linear-gradient(90deg,#ff8fd0,#ffe680,#80d4ff)"></span></span><b style="color:#b0166e">Lvl 3 ›</b></div>
    <div style="display:flex;gap:8px;justify-content:flex-end">
      <button style="font:600 14px/1 Fredoka,sans-serif;color:#b0166e;background:#fff;border:0;border-radius:999px;padding:11px 16px;box-shadow:inset 0 0 0 2px #b0166e">Unequip all</button>
      <button style="font:600 14px/1 Fredoka,sans-serif;color:#fff;background:#b0166e;border:0;border-radius:999px;padding:11px 18px;box-shadow:0 0 0 2px #fff, 0 3px 8px rgba(176,22,110,.35)">Send to ring</button>
    </div>
    <div style="font-size:13px;color:#6f4c8e">Deck 3/9 · needs 6 more to enter the ring</div>
    <div style="display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px">
      <div class="slot"><span class="rl" style="background:#b0166e">ATTACK</span><span class="nm">Sticketh</span></div>
      <div class="slot"><span class="rl" style="background:#0b6a50">HEAL</span><span class="nm">Gloaming Rest</span></div>
      <div class="slot"><span class="rl" style="background:#5a3a8e">TRICK</span><span class="nm">Dissonant Voice</span></div>
      <div class="slot empty"><span style="font:700 22px/1 Fredoka;color:#e3a9d6">+</span></div>
      <div class="slot empty"><span style="font:700 22px/1 Fredoka;color:#e3a9d6">+</span></div>
      <div class="slot empty"><span style="font:700 22px/1 Fredoka;color:#e3a9d6">+</span></div>
    </div>
  </section>
</div>
</body>
</html>
