<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Millefleur v2 level-up sheet</title>
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
.gain{display:flex;flex-direction:column;align-items:center;gap:4px;padding:10px 0;border-radius:14px;background:linear-gradient(170deg,#ffffff,#f6f1ff);box-shadow:0 0 0 1px rgba(200,180,230,.45)}
.gain b{font:800 17px/1 Nunito,sans-serif;color:#1f6b57}
.gain span{font:700 10px/1 Nunito,sans-serif;letter-spacing:.06em;color:#6e6190}
.chip{display:inline-block;padding:7px 12px;margin:0 6px 8px 0;font:700 12.5px/1.2 Nunito,sans-serif;color:#3b2a55;background:rgba(255,255,255,.9);border-radius:999px;box-shadow:0 0 0 1px rgba(200,180,230,.6), 0 3px 8px rgba(120,90,170,.08)}
</style>
</head>
<body style="margin:0">
<div style="position:relative;width:390px;height:940px;overflow:hidden;font-family:Nunito,sans-serif;color:#3b2a55;background:#fbf8fc">
  <svg aria-hidden="true" width="390" height="940" style="position:absolute;inset:0">
    <defs>
      <filter id="wcL" x="-30%" y="-30%" width="160%" height="160%"><feTurbulence type="fractalNoise" baseFrequency="0.011" numOctaves="3" seed="7"></feTurbulence><feDisplacementMap in="SourceGraphic" scale="70"></feDisplacementMap><feGaussianBlur stdDeviation="16"></feGaussianBlur></filter>
    </defs>
    <g filter="url(#wcL)">
      <ellipse cx="40" cy="110" rx="190" ry="140" fill="#e8dbff" opacity=".9"></ellipse>
      <ellipse cx="360" cy="330" rx="150" ry="190" fill="#d3f2e8" opacity=".8"></ellipse>
    </g>
  </svg>
  <div aria-hidden="true" style="position:absolute;left:16px;right:16px;top:150px;height:420px;border-radius:24px;background:rgba(255,255,255,.7)"></div>
  <div style="position:absolute;inset:0;background:linear-gradient(180deg,rgba(80,60,120,.18),rgba(80,60,120,.32));backdrop-filter:blur(2px)"></div>

  <section role="dialog" aria-labelledby="v2lvl" style="position:absolute;left:0;right:0;bottom:0;border-radius:28px 28px 0 0;background:linear-gradient(180deg,#ffffff 0%,#fdfbff 60%,#f7f1ff 100%);box-shadow:0 -10px 40px rgba(80,60,120,.22);overflow:hidden">
    <div aria-hidden="true" style="position:absolute;left:0;right:0;top:0;height:140px;background:linear-gradient(120deg,rgba(255,214,236,.9),rgba(255,241,201,.85) 30%,rgba(211,245,230,.85) 55%,rgba(214,232,255,.85) 78%,rgba(230,217,255,.9));mask-image:linear-gradient(to bottom,#000 30%,transparent)"></div>

    <div style="position:relative;height:50px;display:flex;align-items:center;justify-content:center">
      <div aria-hidden="true" style="position:absolute;left:60px;right:60px;top:19px;height:11px;background:repeating-linear-gradient(to bottom,rgba(90,67,128,.22) 0 1px,transparent 1px 3px);mask-image:linear-gradient(90deg,transparent,#000 20%,#000 80%,transparent)"></div>
      <span style="position:relative;padding:4px 14px;border-radius:999px;background:rgba(255,255,255,.92);font:800 13px/1 Nunito,sans-serif;letter-spacing:.04em;color:#2f2147">Level up</span>
      <button aria-label="Close" style="position:absolute;left:8px;top:3px;width:44px;height:44px;border:0;background:transparent;display:flex;align-items:center;justify-content:center;padding:0"><span style="width:20px;height:20px;border-radius:6px;background:rgba(255,255,255,.95);box-shadow:0 0 0 1px rgba(90,67,128,.45);display:flex;align-items:center;justify-content:center"><svg width="8" height="8" viewBox="0 0 8 8"><path d="M1 1 L7 7 M7 1 L1 7" stroke="#3b2a55" stroke-width="1.4" stroke-linecap="round"></path></svg></span></button>
    </div>

    <div style="position:relative;padding:12px 22px 28px;display:flex;flex-direction:column;gap:18px">
      <div style="display:flex;align-items:center;gap:16px">
        <div style="position:relative;width:76px;height:76px;flex:none">
          <div aria-hidden="true" style="position:absolute;inset:0;border-radius:50%;background:conic-gradient(from 210deg,#ffd6ec,#fff1c9,#d3f5e6,#d6e8ff,#e6d9ff,#ffd6ec);filter:blur(6px)"></div>
          <div style="position:absolute;inset:7px;border-radius:50%;background:radial-gradient(circle at 40% 35%,#ffffff,#f7f1ff);display:flex;align-items:center;justify-content:center;font:800 28px/1 Nunito,sans-serif;color:#a8336f">3</div>
        </div>
        <div>
          <h2 id="v2lvl" style="margin:0;font:800 22px/1.15 Nunito,sans-serif;color:#2f2147">Poirot at level 3</h2>
          <p style="margin:6px 0 0;font-size:13px;line-height:1.45;color:#6e6190">15 more XP to go (13 of 28). Monsters earn XP in the ring, most of it from wins.</p>
        </div>
      </div>

      <div style="display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:7px">
        <div class="gain"><b>+3</b><span>MAX HP</span></div>
        <div class="gain"><b>+1</b><span>AC</span></div>
        <div class="gain"><b>+1</b><span>STR</span></div>
        <div class="gain"><b>+1</b><span>DEX</span></div>
        <div class="gain"><b>+1</b><span>INT</span></div>
      </div>

      <div>
        <div style="font:700 12px/1 Nunito,sans-serif;color:#6e6190;margin-bottom:10px">New cards she can use</div>
        <div>
          <span class="chip">Horn of Proof</span><span class="chip">Unconquerable Horn</span><span class="chip">Brain Drain</span><span class="chip">Soften</span><span class="chip">Molasses</span><span class="chip">Wooden Spear</span>
        </div>
      </div>

      <div>
        <button style="font:800 14px/1 Nunito,sans-serif;color:#ffffff;background:linear-gradient(160deg,#5a4380,#3b2a55);border:0;border-radius:14px;padding:13px 22px;box-shadow:0 0 0 2px #fff, 0 0 0 3.5px rgba(90,67,128,.55), 0 8px 18px rgba(90,67,128,.25)">Close</button>
      </div>
    </div>
  </section>
</div>
</body>
</html>
