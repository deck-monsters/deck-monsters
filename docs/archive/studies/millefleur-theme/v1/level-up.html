<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Millefleur level-up sheet</title>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@1,9..144,600&amp;family=Nunito:wght@400;600;700;800&amp;family=JetBrains+Mono:wght@400;700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
.gain{display:flex;flex-direction:column;align-items:center;gap:2px;padding:8px 0;border-radius:10px;background:#fbf7fd;border:1px solid #e3d6f0}
.gain b{font:800 16px/1 Nunito,sans-serif;color:#0b6f55}
.gain span{font:700 10px/1 Nunito,sans-serif;letter-spacing:.06em;color:#66568a}
.chip{display:inline-block;padding:5px 10px;margin:0 6px 6px 0;font:700 12px/1.2 Nunito,sans-serif;color:#33204f;background:#fff;border-radius:999px;box-shadow:0 0 0 1.5px #fff, 0 0 0 2.5px #d9c6ea, 0 1px 3px rgba(51,32,79,.15)}
</style>
</head>
<body style="margin:0">
<div style="position:relative;width:390px;height:940px;overflow:hidden;font-family:Nunito,sans-serif;color:#33204f;background-color:#fbf7fd;background-image:radial-gradient(ellipse 420px 260px at 0% 8%, rgba(239,228,255,.95), transparent 70%), radial-gradient(ellipse 360px 300px at 110% 40%, rgba(220,245,238,.9), transparent 70%)">

  <div aria-hidden="true" style="padding:16px;display:flex;flex-direction:column;gap:12px;opacity:.9">
    <div style="height:40px;border-radius:10px;background:#fff"></div>
    <div style="height:34px;width:70%;border-radius:10px 10px 0 0;background:#efe4ff"></div>
    <div style="height:300px;border-radius:14px;background:#fff;border:1px solid #33204f"></div>
  </div>
  <div style="position:absolute;inset:0;background:rgba(51,32,79,.35)"></div>

  <section role="dialog" aria-labelledby="lvl-title" style="position:absolute;left:0;right:0;bottom:0;background:#ffffff;border:1px solid #33204f;border-bottom:0;border-radius:20px 20px 0 0;box-shadow:0 -6px 24px rgba(51,32,79,.18);overflow:hidden">
    <div style="position:relative;height:44px;display:flex;align-items:center;justify-content:center;border-bottom:1px solid #33204f;background:linear-gradient(115deg,#ffd1ec 0%,#fff3c4 22%,#c9f7e4 42%,#cfe6ff 62%,#e3d4ff 80%,#ffd1ec 100%)">
      <div aria-hidden="true" style="position:absolute;inset:0;background:conic-gradient(from 200deg at 30% 120%, rgba(255,255,255,.0), rgba(255,255,255,.65), rgba(255,255,255,0) 30%, rgba(255,255,255,.5) 55%, rgba(255,255,255,0) 75%);mix-blend-mode:soft-light"></div>
      <div aria-hidden="true" style="position:absolute;left:52px;right:52px;top:12px;bottom:12px;background:repeating-linear-gradient(to bottom,rgba(51,32,79,.35) 0 1px,transparent 1px 3px)"></div>
      <span style="position:relative;padding:3px 12px;background:#ffffff;border-radius:6px;font:800 13px/1 Nunito,sans-serif;letter-spacing:.02em;color:#1d0f33">Level up</span>
      <button aria-label="Close" style="position:absolute;left:6px;top:0;width:44px;height:44px;border:0;background:transparent;display:flex;align-items:center;justify-content:center;padding:0"><span style="width:16px;height:16px;border:1px solid #1d0f33;background:#fff;display:flex;align-items:center;justify-content:center;border-radius:2px"><svg width="8" height="8" viewBox="0 0 8 8"><path d="M1 1 L7 7 M7 1 L1 7" stroke="#1d0f33" stroke-width="1.3"></path></svg></span></button>
    </div>

    <div style="padding:18px 20px 26px;display:flex;flex-direction:column;gap:14px">
      <div style="display:flex;align-items:center;gap:14px">
        <div style="position:relative;width:64px;height:64px;flex:none;border-radius:50%;background:radial-gradient(circle at 35% 30%,#ffffff,#efe4ff 60%,#e1efff);border:1.5px dashed #b9a5da;display:flex;align-items:center;justify-content:center">
          <span style="font:600 italic 26px/1 Fraunces,serif;color:#a3196b">3</span>
        </div>
        <div>
          <h2 id="lvl-title" style="margin:0;font:600 italic 24px/1.1 Fraunces,serif;color:#1d0f33">Poirot at level 3</h2>
          <svg width="150" height="8" viewBox="0 0 150 8" aria-hidden="true" style="display:block;margin-top:2px"><path d="M2 5 C 30 2, 60 7, 90 4 S 135 3, 148 5" fill="none" stroke="#a3196b" stroke-width="1.6" stroke-linecap="round"></path></svg>
          <p style="margin:6px 0 0;font-size:13px;color:#66568a">15 more XP to go (13 of 28). Monsters earn XP in the ring, most of it from wins.</p>
        </div>
      </div>

      <div style="display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:6px">
        <div class="gain"><b>+3</b><span>MAX HP</span></div>
        <div class="gain"><b>+1</b><span>AC</span></div>
        <div class="gain"><b>+1</b><span>STR</span></div>
        <div class="gain"><b>+1</b><span>DEX</span></div>
        <div class="gain"><b>+1</b><span>INT</span></div>
      </div>

      <div>
        <div style="font:800 11px/1 Nunito,sans-serif;letter-spacing:.08em;color:#66568a;margin-bottom:10px">NEW CARDS SHE CAN USE</div>
        <div>
          <span class="chip" style="position:relative">Horn of Proof<svg width="118" height="34" viewBox="0 0 118 34" aria-hidden="true" style="position:absolute;left:-8px;top:-7px;pointer-events:none"><path d="M10 20 C 4 8, 40 2, 70 4 S 116 10, 112 20 S 70 33, 40 31 S 2 26, 14 14" fill="none" stroke="#7a6a9c" stroke-width="1.1" stroke-linecap="round" opacity=".8"></path></svg></span>
          <span class="chip">Unconquerable Horn</span>
          <span class="chip">Brain Drain</span>
          <span class="chip">Soften</span>
          <span class="chip">Molasses</span>
          <span class="chip">Wooden Spear</span>
        </div>
      </div>

      <div style="display:flex;justify-content:flex-start">
        <button style="font:800 14px/1 Nunito,sans-serif;color:#fff;background:#33204f;border:0;border-radius:8px;padding:12px 20px;box-shadow:0 0 0 2px #fff, 0 0 0 4px #33204f">Close</button>
      </div>
    </div>
  </section>
</div>
</body>
</html>
